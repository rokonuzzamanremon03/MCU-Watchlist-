            { id:"asm1", title:"The Amazing Spider-Man", date:"2012-07-03", uni:"sony", note:"অ্যান্ড্রু গারফিল্ডের স্পাইডার-ম্যান ও লিজার্ডের গল্প।", note_en:"Andrew Garfield's Spider-Man origin with Lizard.", mcu_conn_bn:"অ্যান্ড্রু গারফিল্ড নো ওয়ে হোম-এ MCU তে যোগ দেন।", mcu_conn_en:"Andrew Garfield crosses into MCU during No Way Home.", poster_url:"https://image.tmdb.org/t/p/w300/3932e49c7i200e408e001.jpg" },

            { id:"sm_nwh", title:"Spider-Man: No Way Home", date:"2021-12-17", uni:"mcu", note:"মাল্টিভার্স খুলে টোবি, অ্যান্ড্রু ও ভিলেনদের আগমন।", note_en:"Multiverse opens: Tobey, Andrew, and villains arrive.", mcu_conn_bn:"MCU, Sony Spider-Verse এবং Fox Marvel ফ্র্যাঞ্চাইজি এক বিন্দুতে মিলিত হয়।", mcu_conn_en:"Bridges MCU, Sony Spider-Verse, and Fox Marvel franchises.", poster_url:"https://image.tmdb.org/t/p/w300/1g0dhY23408e408e001.jpg" },
            { id:"dp_w", title:"Deadpool & Wolverine", date:"2024-07-26", uni:"mcu", note:"ডেডপুল ও উলভারিনের MCU টাইমলাইনে এন্ট্রি।", note_en:"Deadpool and Wolverine enter the MCU timeline.", mcu_conn_bn:"ফক্স ইউনিভার্স ও MCU এর সমন্বয়: TVA এবং সিক্রেট ওয়ার্সের লিংক।", mcu_conn_en:"Connects the Fox X-Men Universe directly with the MCU TVA.", poster_url:"https://image.tmdb.org/t/p/w300/8cd223849e200e408e001.jpg" },
            { id:"sm_bnd", title:"Spider-Man: Brand New Day", date:"2026-07-31", uni:"future", note:"টম হল্যান্ডের নতুন স্পাইডার-ম্যান অধ্যায়।", note_en:"Tom Holland's next Spider-Man chapter.", mcu_conn_bn:"নো ওয়ে হোমের পর পিটারের একক স্ট্রিট-লেভেল যুদ্ধ।", mcu_conn_en:"Follows Peter Parker's solo journey post-No Way Home.", poster_url:"https://image.tmdb.org/t/p/w300/sm4_poster_placeholder.jpg" }
        ];

        // ---------------- Fetch from Supabase with local fallback ----------------
        async function loadMoviesData() {
            try {
                const { data, error } = await sb.from('marvel_movies').select('*');
                if (!error && data && data.length > 0) {
                    marvelData = data.map(m => ({
                        id: m.id,
                        title: m.title.replace(/\s*\(\d{4}\)/g, ''), // Strip year from title if present
                        date: m.release_date,
                        uni: m.universe,
                        note: m.note_bn ? m.note_bn.replace(/—/g, ':') : '',
                        note_en: m.note_en ? m.note_en.replace(/—/g, ':') : '',
                        mcu_conn_bn: m.mcu_conn_bn ? m.mcu_conn_bn.replace(/—/g, ':') : '',
                        mcu_conn_en: m.mcu_conn_en ? m.mcu_conn_en.replace(/—/g, ':') : '',
                        poster_url: m.poster_url || 'https://via.placeholder.com/300x450?text=Marvel',
                        trailer_url: m.trailer_url
                    }));
                }
            } catch (err) {
                console.warn("Using default local movie data array:", err);
            }
            marvelData.sort((a, b) => new Date(a.date) - new Date(b.date));
            renderList();
            updateProgress();
        }

        const today = new Date("2026-07-27");
        let savedState = JSON.parse(localStorage.getItem('marvelUltimateTracker')) || {};

        // ---------------- Sync state ----------------
        const getDeviceId = () => {
            let d = localStorage.getItem('marvel_device_id');
            if (!d) { d = crypto.randomUUID(); localStorage.setItem('marvel_device_id', d); }
            return d;
        };
        const deviceId = getDeviceId();
        const deviceLabel = (navigator.userAgentData?.platform || navigator.platform || 'Device') + ' · ' + (navigator.userAgent.match(/Chrome|Firefox|Safari|Edg/)?.[0] || 'Browser');

        function getSyncInfo() {
            const raw = localStorage.getItem('marvel_sync_info');
            return raw ? JSON.parse(raw) : null;
        }
        function setSyncInfo(info) { localStorage.setItem('marvel_sync_info', JSON.stringify(info)); }

        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ---------------- Rendering ----------------
        function getUniverseBadge(uni) {
            const t = i18n[lang];
            const label = t.badges[uni] || '';
            return `<span class="universe-badge ${uni}">${label}</span>`;
        }
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const monthsBn = ["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
            const monthsEn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const months = lang === 'bn' ? monthsBn : monthsEn;
            return `${months[d.getMonth()]} ${d.getFullYear()}`;
        }
        function updateProgress() {
            const totalMovies = marvelData.length;
            const checkedCount = Object.values(savedState).filter(v => v === true).length;
            const percentage = totalMovies === 0 ? 0 : Math.round((checkedCount / totalMovies) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}% (${checkedCount}/${totalMovies})`;
        }
        async function pushStateToServer() {
            const info = getSyncInfo();
            if (!info) return;
            const nowIso = new Date().toISOString();
            await sb.from('marvel_tracker_state').upsert({ key_id: info.keyId, state: savedState, updated_at: nowIso });
            localStorage.setItem('marvel_state_updated_at', nowIso);
        }
        function toggleCheckbox(id) {
            savedState[id] = !savedState[id];
            localStorage.setItem('marvelUltimateTracker', JSON.stringify(savedState));
            const labelContainer = document.getElementById(`container-${id}`);
            if (savedState[id]) { labelContainer.classList.add('checked-item', 'bg-slate-800'); labelContainer.classList.remove('bg-slate-800/40'); }
            else { labelContainer.classList.remove('checked-item', 'bg-slate-800'); labelContainer.classList.add('bg-slate-800/40'); }
            updateProgress();
            pushStateToServer();
        }
        window.toggleCheckbox = toggleCheckbox;

        function renderList() {
            const container = document.getElementById('movie-list');
            container.innerHTML = '';
            const t = i18n[lang];

            marvelData.forEach(movie => {
                const isChecked = savedState[movie.id] || false;
                const isReleased = new Date(movie.date) <= today;
                const bgClass = isChecked ? 'bg-slate-800 checked-item' : 'bg-slate-800/40';
                const note = lang === 'bn' ? movie.note : movie.note_en;
                const cleanTitle = movie.title.replace(/\s*\(\d{4}\)/g, ''); // Removes duplicate (YYYY)
                const poster = movie.poster_url || 'https://via.placeholder.com/100x150?text=Marvel';
                const trailerUrl = movie.trailer_url || `https://www.youtube.com/results?search_query=${encodeURIComponent(cleanTitle + ' Official Trailer')}`;

                const html = `
                    <div id="container-${movie.id}" class="flex flex-col sm:flex-row items-start gap-4 p-4 mb-3 rounded-xl transition-all duration-300 hover:bg-slate-700/60 border border-slate-700/50 ${bgClass}">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="${movie.id}" ${isChecked ? 'checked' : ''} ${isReleased ? '' : 'disabled'}
                                   class="w-6 h-6 text-blue-500 bg-slate-900 border-slate-600 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed"
                                   onclick="toggleCheckbox('${movie.id}')">
                            <img src="${poster}" alt="${cleanTitle}" class="w-16 h-24 object-cover rounded-lg border border-slate-700 shadow shrink-0" loading="lazy">
                        </div>
                        <div class="flex-1 w-full">
                            <div class="flex items-center flex-wrap gap-2 mb-1">
                                <span class="date-badge">${formatDate(movie.date)}</span>
                                <span class="title-text font-bold text-lg md:text-xl text-slate-100">${cleanTitle}</span>
                                ${getUniverseBadge(movie.uni)}
                                ${(!isReleased && movie.uni !== 'future') ? `<span class="universe-badge future">${t.upcoming}</span>` : ''}
                            </div>
                            <p class="note-text text-sm text-slate-400 leading-relaxed mb-3">${note}</p>
                            
                            <!-- Action buttons -->
                            <div class="flex flex-wrap gap-2 pt-1 border-t border-slate-700/40">
                                <button onclick="openInfoModal('${movie.id}', 'details')" class="text-xs px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-md font-semibold transition">
                                    ${t.btnDetails}
                                </button>
                                <a href="${trailerUrl}" target="_blank" rel="noopener noreferrer" class="text-xs px-2.5 py-1 bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-800/60 rounded-md font-semibold transition flex items-center">
                                    ${icons.play} ${t.btnTrailer}
                                </a>
                                <button onclick="openInfoModal('${movie.id}', 'mcu')" class="text-xs px-2.5 py-1 bg-blue-950/60 hover:bg-blue-900/80 text-blue-300 border border-blue-800/60 rounded-md font-semibold transition flex items-center">
                                    ${icons.link} ${t.btnMcuConn}
                                </button>
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += html;
            });
        }

        // ---------------- Modal Logic ----------------
        window.openInfoModal = (id, type) => {
            const movie = marvelData.find(m => m.id === id);
            if (!movie) return;
            const t = i18n[lang];
            
            document.getElementById('modalTitle').innerText = movie.title.replace(/\s*\(\d{4}\)/g, '');
            document.getElementById('modalDate').innerText = formatDate(movie.date);
            document.getElementById('modalPoster').src = movie.poster_url || 'https://via.placeholder.com/150';
            document.getElementById('modalBadge').innerHTML = getUniverseBadge(movie.uni);
            
            document.getElementById('modalDescHeader').innerText = t.descHeader;
            document.getElementById('modalDesc').innerText = lang === 'bn' ? (movie.note || 'বিবরণ নেই') : (movie.note_en || 'No description');
            
            document.getElementById('modalConnHeader').innerText = t.connHeader;
            document.getElementById('modalConn').innerText = lang === 'bn' ? (movie.mcu_conn_bn || 'MCU ট্রানজিশন বিবরণ নেই') : (movie.mcu_conn_en || 'No MCU connection details');

            document.getElementById('infoModal').classList.remove('hidden');
        };

        document.getElementById('closeInfoModal').onclick = () => document.getElementById('infoModal').classList.add('hidden');

        function renderLegend() {
            const t = i18n[lang];
            const order = ['mcu','mcutv','sony','sonyanim','fox','netflix','other'];
            document.getElementById('legendRow').innerHTML = order.map(u => `<span class="universe-badge ${u}">${t.badges[u]}</span>`).join('') + `<span class="universe-badge future">${t.upcoming}</span>`;
        }

        function applyStaticText() {
            const t = i18n[lang];
            document.getElementById('htmlRoot').lang = lang;
            document.title = t.title;
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('pageSubtitle').innerText = t.subtitle;
            document.getElementById('pageTodayNote').innerText = t.todayNote;
            document.getElementById('progressLabel').innerText = t.progressLabel;
            
            document.getElementById('genKeyBtn').innerHTML = t.genKeyBtn;
            document.getElementById('syncBtn').innerHTML = t.syncBtn;
            document.getElementById('genOnceWarning').innerHTML = t.genOnceWarning;
            document.getElementById('approveBtn').innerHTML = t.approveBtn;
            document.getElementById('denyBtn').innerHTML = t.denyBtn;
            
            document.getElementById('genModalTitle').innerText = t.genModalTitle;
            document.getElementById('genModalDesc').innerText = t.genModalDesc;
            document.getElementById('genName').placeholder = t.namePh;
            document.getElementById('genEmail').placeholder = t.emailPh;
            document.getElementById('genCountry').placeholder = t.countryPh;
            document.getElementById('genSubmitBtn').innerText = t.genSubmit;
            document.getElementById('genCancelBtn').innerText = t.genCancel;
            
            renderLegend();
            updateSyncStatusUI();
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            lang = lang === 'bn' ? 'en' : 'bn';
            localStorage.setItem('marvel_lang', lang);
            applyStaticText();
            renderList();
        });

        // ---------------- Sync status UI ----------------
        let deviceCountCache = 1;
        function updateSyncStatusUI() {
            const t = i18n[lang];
            const info = getSyncInfo();
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncStatusText');
            if (info) {
                dot.className = 'sync-dot bg-emerald-500';
                text.innerText = t.syncedText(deviceCountCache);
            } else {
                dot.className = 'sync-dot bg-slate-500';
                text.innerText = t.notSyncedText;
            }
        }

        // ---------------- Generate Key (Fixed Logic + Fallback) ----------------
        const genKeyModal = document.getElementById('genKeyModal');
        document.getElementById('genKeyBtn').addEventListener('click', () => {
            document.getElementById('genStatusMsg').innerHTML = '';
            genKeyModal.classList.remove('hidden');
        });
        document.getElementById('genCancelBtn').addEventListener('click', () => genKeyModal.classList.add('hidden'));

        document.getElementById('genSubmitBtn').addEventListener('click', async () => {
            const t = i18n[lang];
            const name = document.getElementById('genName').value.trim();
            const email = document.getElementById('genEmail').value.trim();
            const country = document.getElementById('genCountry').value.trim();
            const statusEl = document.getElementById('genStatusMsg');
            
            if (!name || !email || !country) { 
                statusEl.className = 'flex items-center text-red-400 text-xs mt-3'; 
                statusEl.innerHTML = t.genMissing; 
                return; 
            }
            
            statusEl.className = 'flex items-center text-slate-400 text-xs mt-3'; 
            statusEl.innerHTML = t.genWorking;
            
            try {
                const rawKey = crypto.randomUUID() + '-' + crypto.randomUUID().replace(/-/g, '').slice(0, 12);
                const keyHash = await sha256Hex(rawKey);
                const nowIso = new Date().toISOString();

                let keyId = null;
                // Attempt Supabase Insert
                const { data: keyRow, error: keyErr } = await sb.from('marvel_tracker_keys')
                    .insert({ key_hash: keyHash, name, email, country }).select('id').maybeSingle();

                if (!keyErr && keyRow) {
                    keyId = keyRow.id;
                    await sb.from('marvel_tracker_devices').insert({ key_id: keyId, device_id: deviceId, device_label: deviceLabel, approved: true });
                    await sb.from('marvel_tracker_state').upsert({ key_id: keyId, state: savedState, updated_at: nowIso });
                } else {
                    keyId = crypto.randomUUID(); // Fallback key ID if database insertion fails
                }

                setSyncInfo({ keyId, keyHash });
                localStorage.setItem('marvel_state_updated_at', nowIso);

                // Trigger key.json Download
                const payload = { key: rawKey, name, email, country, created_at: nowIso };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'marvel-tracker-key.json';
                document.body.appendChild(a); a.click(); a.remove();

                statusEl.className = 'flex items-center text-emerald-400 text-xs mt-3'; 
                statusEl.innerHTML = t.genDone;
                updateSyncStatusUI();
                startPolling();
                setTimeout(() => genKeyModal.classList.add('hidden'), 1800);
            } catch (e) {
                console.error("Key generation error:", e);
                statusEl.className = 'flex items-center text-red-400 text-xs mt-3'; 
                statusEl.innerHTML = t.genError;
            }
        });

        // ---------------- Sync (Upload key.json) ----------------
        const keyFileInput = document.getElementById('keyFileInput');
        document.getElementById('syncBtn').addEventListener('click', () => keyFileInput.click());

        keyFileInput.addEventListener('change', async (e) => {
            const t = i18n[lang];
            const file = e.target.files[0];
            keyFileInput.value = '';
            if (!file) return;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);
                const keyHash = await sha256Hex(parsed.key);

                const { data: keyId, error: rpcErr } = await sb.rpc('marvel_tracker_get_key_id', { p_key_hash: keyHash });
                if (rpcErr || !keyId) { alert(t.syncInvalidKey); return; }

                const { data: existingDevice } = await sb.from('marvel_tracker_devices')
                    .select('*').eq('key_id', keyId).eq('device_id', deviceId).maybeSingle();

                if (existingDevice && existingDevice.approved) {
                    setSyncInfo({ keyId, keyHash });
                    await sb.from('marvel_tracker_devices').update({ last_seen: new Date().toISOString() }).eq('id', existingDevice.id);
                    await pullAndMergeState(keyId);
                    alert(t.syncApprovedNow);
                    updateSyncStatusUI();
                    startPolling();
                    return;
                }

                if (!existingDevice) {
                    await sb.from('marvel_tracker_devices').insert({ key_id: keyId, device_id: deviceId, device_label: deviceLabel, approved: false });
                }
                alert(t.syncWaitingApproval);
                setSyncInfo({ keyId, keyHash, pending: true });
                updateSyncStatusUI();
                startPolling();
            } catch (err) {
                console.error(err);
                alert(t.syncInvalidKey);
            }
        });

        async function pullAndMergeState(keyId) {
            const { data } = await sb.from('marvel_tracker_state').select('*').eq('key_id', keyId).maybeSingle();
            if (data) {
                const localUpdatedAt = localStorage.getItem('marvel_state_updated_at');
                if (!localUpdatedAt || new Date(data.updated_at) > new Date(localUpdatedAt)) {
                    savedState = data.state || {};
                    localStorage.setItem('marvelUltimateTracker', JSON.stringify(savedState));
                    localStorage.setItem('marvel_state_updated_at', data.updated_at);
                    renderList();
                    updateProgress();
                } else if (new Date(data.updated_at) < new Date(localUpdatedAt)) {
                    await pushStateToServer();
                }
            } else {
                await pushStateToServer();
            }
        }

        // ---------------- Polling ----------------
        let pollTimer = null;
        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(pollCycle, 7000);
            pollCycle();
            window.addEventListener('focus', pollCycle);
        }

        async function pollCycle() {
            const info = getSyncInfo();
            if (!info) return;
            const t = i18n[lang];

            if (info.pending) {
                const { data } = await sb.from('marvel_tracker_devices').select('*').eq('key_id', info.keyId).eq('device_id', deviceId).maybeSingle();
                if (data && data.approved) {
                    setSyncInfo({ keyId: info.keyId, keyHash: info.keyHash });
                    await pullAndMergeState(info.keyId);
                    updateSyncStatusUI();
                } else {
                    return;
                }
            } else {
                await pullAndMergeState(info.keyId);
                const { data: allDevices } = await sb.from('marvel_tracker_devices').select('*').eq('key_id', info.keyId);
                if (allDevices) {
                    deviceCountCache = allDevices.filter(d => d.approved).length || 1;
                    updateSyncStatusUI();
                    const pendingOther = allDevices.find(d => !d.approved && d.device_id !== deviceId);
                    const banner = document.getElementById('approvalBanner');
                    if (pendingOther) {
                        document.getElementById('approvalText').innerHTML = t.approvalBannerText(pendingOther.device_label || 'Unknown device');
                        banner.classList.remove('hidden');
                        document.getElementById('approveBtn').onclick = async () => {
                            await sb.from('marvel_tracker_devices').update({ approved: true }).eq('id', pendingOther.id);
                            banner.classList.add('hidden');
                        };
                        document.getElementById('denyBtn').onclick = async () => {
                            await sb.from('marvel_tracker_devices').delete().eq('id', pendingOther.id);
                            banner.classList.add('hidden');
                        };
                    } else {
                        banner.classList.add('hidden');
                    }
                }
            }
        }

        // ---------------- Init ----------------
        applyStaticText();
        loadMoviesData();
        if (getSyncInfo()) startPolling();
    </script>
</body>
</html>
