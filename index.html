                        note_en: m.note_en ? m.note_en.replace(/—/g, ':') : '',
                        mcu_conn_bn: m.mcu_conn_bn ? m.mcu_conn_bn.replace(/—/g, ':') : '',
                        mcu_conn_en: m.mcu_conn_en ? m.mcu_conn_en.replace(/—/g, ':') : '',
                        poster_url: m.poster_url || '',
                        trailer_url: m.trailer_url
                    }));
                }
            } catch (err) {
                console.error("Database fetch failed", err);
            }
            marvelData.sort((a, b) => new Date(a.date) - new Date(b.date));
            renderList();
            updateProgress();
        }

        // Generate precise OS and Browser string (Since exact phone name is restricted by browsers)
        function getDeviceName() {
            const ua = navigator.userAgent;
            let os = "Unknown OS";
            if (ua.indexOf("Win") !== -1) os = "Windows";
            if (ua.indexOf("Mac") !== -1) os = "MacOS";
            if (ua.indexOf("Android") !== -1) os = "Android";
            if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";
            if (ua.indexOf("Linux") !== -1 && ua.indexOf("Android") === -1) os = "Linux";

            let browser = "Unknown Browser";
            if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
            if (ua.indexOf("Safari") !== -1 && ua.indexOf("Chrome") === -1) browser = "Safari";
            if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
            if (ua.indexOf("Edg") !== -1) browser = "Edge";

            return `${os} · ${browser}`;
        }

        const getDeviceId = () => {
            let d = localStorage.getItem('marvel_device_id');
            if (!d) { d = crypto.randomUUID(); localStorage.setItem('marvel_device_id', d); }
            return d;
        };
        const deviceId = getDeviceId();
        const deviceLabel = getDeviceName();

        function getSyncInfo() {
            const raw = localStorage.getItem('marvel_sync_info');
            return raw ? JSON.parse(raw) : null;
        }
        function setSyncInfo(info) { localStorage.setItem('marvel_sync_info', JSON.stringify(info)); }
        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function getUniverseBadge(uni) {
            const t = i18n[lang];
            const label = t.badges[uni] || '';
            return `<span class="universe-badge ${uni}">${label}</span>`;
        }
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const monthsBn = ["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
            const monthsEn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const months = lang === 'bn' ? monthsBn : monthsEn;
            return `${months[d.getMonth()]} ${d.getFullYear()}`;
        }
        
        function updateProgress() {
            const totalMovies = marvelData.length;
            const validCheckedCount = Object.keys(savedState).filter(id => savedState[id] === true && marvelData.some(m => m.id === id)).length;
            const percentage = totalMovies === 0 ? 0 : Math.round((validCheckedCount / totalMovies) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}% (${validCheckedCount}/${totalMovies})`;
        }

        async function pushStateToServer() {
            const info = getSyncInfo();
            if (!info || info.pending) return;
            const nowIso = new Date().toISOString();
            await sb.from('marvel_tracker_state').upsert({ key_id: info.keyId, state: savedState, updated_at: nowIso });
            localStorage.setItem('marvel_state_updated_at', nowIso);
        }

        function toggleCheckbox(id) {
            savedState[id] = !savedState[id];
            localStorage.setItem('marvelUltimateTracker', JSON.stringify(savedState));
            const labelContainer = document.getElementById(`container-${id}`);
            if (savedState[id]) { labelContainer.classList.add('checked-item', 'bg-slate-800'); labelContainer.classList.remove('bg-slate-800/40'); }
            else { labelContainer.classList.remove('checked-item', 'bg-slate-800'); labelContainer.classList.add('bg-slate-800/40'); }
            updateProgress();
            pushStateToServer();
        }
        window.toggleCheckbox = toggleCheckbox;

        function renderList() {
            const container = document.getElementById('movie-list');
            container.innerHTML = '';
            const t = i18n[lang];

            marvelData.forEach(movie => {
                const isChecked = savedState[movie.id] || false;
                const isReleased = new Date(movie.date) <= today;
                const bgClass = isChecked ? 'bg-slate-800 checked-item' : 'bg-slate-800/40';
                const note = lang === 'bn' ? movie.note_bn : movie.note_en;
                const poster = movie.poster_url || `https://placehold.co/300x450/0f172a/475569?text=${encodeURIComponent(movie.title)}`;
                const trailerUrl = movie.trailer_url || `https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title + ' Official Trailer')}`;

                const html = `
                    <div id="container-${movie.id}" class="flex flex-col sm:flex-row items-start gap-5 p-5 rounded-2xl transition-all duration-300 hover:bg-slate-700/60 border border-slate-700/50 ${bgClass}">
                        <div class="flex items-center gap-4">
                            <input type="checkbox" id="${movie.id}" ${isChecked ? 'checked' : ''} ${isReleased ? '' : 'disabled'}
                                   class="w-7 h-7 text-blue-500 bg-slate-900 border-slate-600 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed"
                                   onclick="toggleCheckbox('${movie.id}')">
                            <img src="${poster}" onerror="this.onerror=null; this.src='https://placehold.co/300x450/0f172a/475569?text=${encodeURIComponent(movie.title)}';" alt="${movie.title}" class="w-20 h-32 object-cover rounded-lg border border-slate-700 shadow-md shrink-0" loading="lazy">
                        </div>
                        <div class="flex-1 w-full pt-1">
                            <div class="flex items-center flex-wrap gap-2 mb-2">
                                <span class="date-badge">${formatDate(movie.date)}</span>
                                <span class="title-text font-bold text-xl md:text-2xl text-slate-100">${movie.title}</span>
                                ${getUniverseBadge(movie.uni)}
                                ${(!isReleased && movie.uni !== 'future') ? `<span class="universe-badge future">${t.upcoming}</span>` : ''}
                            </div>
                            
                            <div class="flex flex-wrap gap-3 mt-4">
                                <button onclick="openDynamicModal('${movie.id}', 'details')" class="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg font-bold transition flex items-center shadow-sm">
                                    ${t.btnDetails}
                                </button>
                                <a href="${trailerUrl}" target="_blank" rel="noopener noreferrer" class="text-xs px-3 py-1.5 bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-800/80 rounded-lg font-bold transition flex items-center shadow-sm">
                                    ${icons.play} ${t.btnTrailer}
                                </a>
                                <button onclick="openDynamicModal('${movie.id}', 'mcu')" class="text-xs px-3 py-1.5 bg-blue-950/80 hover:bg-blue-900 text-blue-300 border border-blue-800/80 rounded-lg font-bold transition flex items-center shadow-sm">
                                    ${icons.link} ${t.btnMcuConn}
                                </button>
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += html;
            });
        }

        window.openDynamicModal = (id, type) => {
            const movie = marvelData.find(m => m.id === id);
            if (!movie) return;
            const t = i18n[lang];
            
            document.getElementById('modalTitle').innerText = movie.title;
            document.getElementById('modalDate').innerText = formatDate(movie.date);
            document.getElementById('modalPoster').src = movie.poster_url || `https://placehold.co/300x450/0f172a/475569?text=${encodeURIComponent(movie.title)}`;
            document.getElementById('modalBadge').innerHTML = getUniverseBadge(movie.uni);
            
            const sectionHeader = document.getElementById('modalSectionHeader');
            const sectionContent = document.getElementById('modalSectionContent');

            if (type === 'details') {
                sectionHeader.innerText = t.descHeader;
                sectionHeader.className = "font-bold text-emerald-400 mb-2 text-lg uppercase tracking-wide";
                sectionContent.innerText = lang === 'bn' ? (movie.note_bn || 'বিবরণ নেই') : (movie.note_en || 'No description');
            } else if (type === 'mcu') {
                sectionHeader.innerText = t.connHeader;
                sectionHeader.className = "font-bold text-blue-400 mb-2 text-lg uppercase tracking-wide";
                sectionContent.innerText = lang === 'bn' ? (movie.mcu_conn_bn || 'MCU ডেটাবেসে যুক্ত করা হয়নি') : (movie.mcu_conn_en || 'MCU connection data not found');
            }

            document.getElementById('infoModal').classList.remove('hidden');
        };

        document.getElementById('closeInfoModal').onclick = () => document.getElementById('infoModal').classList.add('hidden');

        function renderLegend() {
            const t = i18n[lang];
            const order = ['mcu','mcutv','sony','sonyanim','fox','netflix','other'];
            document.getElementById('legendRow').innerHTML = order.map(u => `<span class="universe-badge ${u}">${t.badges[u]}</span>`).join('') + `<span class="universe-badge future">${t.upcoming}</span>`;
        }

        function applyStaticText() {
            const t = i18n[lang];
            document.getElementById('htmlRoot').lang = lang;
            document.title = t.title;
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('pageSubtitle').innerText = t.subtitle;
            document.getElementById('pageTodayNote').innerText = t.todayNote;
            document.getElementById('progressLabel').innerText = t.progressLabel;
            
            document.getElementById('manageDevBtn').innerHTML = t.manageDevBtn;
            document.getElementById('devModalTitle').innerText = t.devModalTitle;
            document.getElementById('devModalDesc').innerText = t.devModalDesc;
            document.getElementById('rotateKeyDesc').innerText = t.rotateKeyDesc;
            document.getElementById('rotateKeyBtn').innerHTML = t.rotateKeyBtn;

            document.getElementById('genKeyBtn').innerHTML = t.genKeyBtn;
            document.getElementById('syncBtn').innerHTML = t.syncBtn;
            document.getElementById('genOnceWarning').innerHTML = t.genOnceWarning;
            document.getElementById('approveBtn').innerHTML = t.approveBtn;
            document.getElementById('denyBtn').innerHTML = t.denyBtn;
            
            document.getElementById('genModalTitle').innerText = t.genModalTitle;
            document.getElementById('genModalDesc').innerText = t.genModalDesc;
            document.getElementById('genName').placeholder = t.namePh;
            document.getElementById('genEmail').placeholder = t.emailPh;
            document.getElementById('genCountry').placeholder = t.countryPh;
            document.getElementById('genSubmitBtn').innerText = t.genSubmit;
            document.getElementById('genCancelBtn').innerText = t.genCancel;
            
            renderLegend();
            updateSyncStatusUI();
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            lang = lang === 'bn' ? 'en' : 'bn';
            localStorage.setItem('marvel_lang', lang);
            applyStaticText();
            renderList();
        });

        let deviceCountCache = 1;
        function updateSyncStatusUI() {
            const t = i18n[lang];
            const info = getSyncInfo();
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncStatusText');
            const manageBtn = document.getElementById('manageDevBtn');

            if (info && !info.pending) {
                dot.className = 'sync-dot bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]';
                text.innerText = t.syncedText(deviceCountCache);
                manageBtn.classList.remove('hidden');
                manageBtn.classList.add('flex');
            } else {
                dot.className = 'sync-dot bg-slate-500';
                text.innerText = t.notSyncedText;
                manageBtn.classList.add('hidden');
                manageBtn.classList.remove('flex');
            }
        }

        // ---------------- Generating New Key ----------------
        const genKeyModal = document.getElementById('genKeyModal');
        document.getElementById('genKeyBtn').addEventListener('click', () => {
            document.getElementById('genStatusMsg').innerHTML = '';
            genKeyModal.classList.remove('hidden');
        });
        document.getElementById('genCancelBtn').addEventListener('click', () => genKeyModal.classList.add('hidden'));

        document.getElementById('genSubmitBtn').addEventListener('click', async () => {
            const t = i18n[lang];
            const name = document.getElementById('genName').value.trim();
            const email = document.getElementById('genEmail').value.trim();
            const country = document.getElementById('genCountry').value.trim();
            const statusEl = document.getElementById('genStatusMsg');
            
            if (!name || !email || !country) { 
                statusEl.className = 'flex items-center text-red-400 text-xs mt-3'; 
                statusEl.innerHTML = t.genMissing; 
                return; 
            }
            
            statusEl.className = 'flex items-center text-slate-400 text-xs mt-3'; 
            statusEl.innerHTML = t.genWorking;
            
            try {
                const rawKey = crypto.randomUUID() + 'x' + crypto.randomUUID().replace(/-/g, '').slice(0, 12);
                const keyHash = await sha256Hex(rawKey);
                const nowIso = new Date().toISOString();

                const { data: keyRow, error: keyErr } = await sb.from('marvel_tracker_keys')
                    .insert({ key_hash: keyHash, name, email, country }).select('id').single();
                if (keyErr) throw keyErr;

                await sb.from('marvel_tracker_devices').insert({ key_id: keyRow.id, device_id: deviceId, device_label: deviceLabel, approved: true });
                await sb.from('marvel_tracker_state').upsert({ key_id: keyRow.id, state: savedState, updated_at: nowIso });

                setSyncInfo({ keyId: keyRow.id, keyHash });
                localStorage.setItem('marvel_state_updated_at', nowIso);

                const payload = { key: rawKey, name, email, country, created_at: nowIso };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'marvel-sync-key.json';
                document.body.appendChild(a); a.click(); a.remove();

                statusEl.className = 'flex items-center text-emerald-400 text-xs mt-3'; 
                statusEl.innerHTML = t.genDone;
                updateSyncStatusUI();
                startPolling();
                setTimeout(() => genKeyModal.classList.add('hidden'), 1800);
            } catch (e) {
                console.error(e);
                statusEl.className = 'flex items-center text-red-400 text-xs mt-3'; 
                statusEl.innerHTML = t.genError;
            }
        });

        // ---------------- Sync Upload ----------------
        const keyFileInput = document.getElementById('keyFileInput');
        document.getElementById('syncBtn').addEventListener('click', () => keyFileInput.click());

        keyFileInput.addEventListener('change', async (e) => {
            const t = i18n[lang];
            const file = e.target.files[0];
            keyFileInput.value = '';
            if (!file) return;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);
                const keyHash = await sha256Hex(parsed.key);

                const { data: keyId, error: rpcErr } = await sb.rpc('marvel_tracker_get_key_id', { p_key_hash: keyHash });
                if (rpcErr || !keyId) { alert(t.syncInvalidKey); return; }

                const { data: existingDevice } = await sb.from('marvel_tracker_devices')
                    .select('*').eq('key_id', keyId).eq('device_id', deviceId).maybeSingle();

                if (existingDevice && existingDevice.approved) {
                    setSyncInfo({ keyId, keyHash });
                    await sb.from('marvel_tracker_devices').update({ last_seen: new Date().toISOString() }).eq('id', existingDevice.id);
                    await pullAndMergeState(keyId);
                    alert(t.syncApprovedNow);
                    updateSyncStatusUI();
                    startPolling();
                    return;
                }

                if (!existingDevice) {
                    await sb.from('marvel_tracker_devices').insert({ key_id: keyId, device_id: deviceId, device_label: deviceLabel, approved: false });
                }
                alert(t.syncWaitingApproval);
                setSyncInfo({ keyId, keyHash, pending: true });
                updateSyncStatusUI();
                startPolling();
            } catch (err) {
                console.error(err);
                alert(t.syncInvalidKey);
            }
        });

        // ---------------- Device Manager & Rotate Key ----------------
        const devModal = document.getElementById('deviceManagerModal');
        const devListContainer = document.getElementById('deviceListContainer');

        document.getElementById('manageDevBtn').addEventListener('click', async () => {
            devModal.classList.remove('hidden');
            await loadDevices();
        });
        document.getElementById('closeDeviceModal').addEventListener('click', () => devModal.classList.add('hidden'));

        async function loadDevices() {
            const info = getSyncInfo();
            if (!info) return;
            const t = i18n[lang];
            
            devListContainer.innerHTML = `<p class="text-slate-400 text-center text-sm mt-4">Loading...</p>`;
            const { data: devices } = await sb.from('marvel_tracker_devices').select('*').eq('key_id', info.keyId).eq('approved', true);
            
            if (devices) {
                devListContainer.innerHTML = '';
                devices.forEach(dev => {
                    const isMe = dev.device_id === deviceId;
                    const dateStr = new Date(dev.last_seen || new Date()).toLocaleString(lang === 'bn' ? 'bn-BD' : 'en-US', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                    
                    devListContainer.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-slate-800 rounded-lg border border-slate-700">
                            <div>
                                <p class="text-slate-200 font-bold text-sm">${dev.device_label || 'Unknown Device'} ${isMe ? `<span class="text-[0.6rem] bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded ml-2 uppercase">${t.thisDevice}</span>` : ''}</p>
                                <p class="text-slate-400 text-xs">Last active: ${dateStr}</p>
                            </div>
                            ${!isMe ? `
                                <button onclick="removeDevice('${dev.id}')" class="text-xs text-red-400 hover:text-white hover:bg-red-800 px-3 py-1.5 rounded bg-slate-900 border border-red-900/50 transition">
                                    ${icons.trash} ${t.removeBtn}
                                </button>
                            ` : ''}
                        </div>
                    `;
                });
            }
        }

        window.removeDevice = async (dbId) => {
            await sb.from('marvel_tracker_devices').delete().eq('id', dbId);
            await loadDevices(); // refresh list
        };

        document.getElementById('rotateKeyBtn').addEventListener('click', async () => {
            const info = getSyncInfo();
            if (!info) return;
            const t = i18n[lang];
            
            const btn = document.getElementById('rotateKeyBtn');
            btn.innerHTML = `${icons.sync} ${t.genWorking}`;
            
            try {
                // Generate completely new hash
                const rawKey = crypto.randomUUID() + 'R' + crypto.randomUUID().replace(/-/g, '').slice(0, 12);
                const keyHash = await sha256Hex(rawKey);
                
                // Update master key in DB
                await sb.from('marvel_tracker_keys').update({ key_hash: keyHash }).eq('id', info.keyId);
                
                // Update local storage so this device stays synced
                setSyncInfo({ keyId: info.keyId, keyHash: keyHash });
                
                // Trigger Download
                const { data: keyData } = await sb.from('marvel_tracker_keys').select('name, email, country').eq('id', info.keyId).single();
                
                const payload = { 
                    key: rawKey, 
                    name: keyData?.name || 'Rotated User', 
                    email: keyData?.email || '', 
                    country: keyData?.country || '', 
                    created_at: new Date().toISOString() 
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'marvel-rotated-key.json';
                document.body.appendChild(a); a.click(); a.remove();

                btn.innerHTML = `${icons.check} Success!`;
                setTimeout(() => {
                    btn.innerHTML = t.rotateKeyBtn;
                    devModal.classList.add('hidden');
                }, 2000);

            } catch(e) {
                console.error(e);
                btn.innerHTML = `${icons.cross} Error`;
            }
        });

        // ---------------- State Sync & Polling ----------------
        async function pullAndMergeState(keyId) {
            const { data } = await sb.from('marvel_tracker_state').select('*').eq('key_id', keyId).maybeSingle();
            if (data) {
                const localUpdatedAt = localStorage.getItem('marvel_state_updated_at');
                if (!localUpdatedAt || new Date(data.updated_at) > new Date(localUpdatedAt)) {
                    savedState = data.state || {};
                    localStorage.setItem('marvelUltimateTracker', JSON.stringify(savedState));
                    localStorage.setItem('marvel_state_updated_at', data.updated_at);
                    renderList();
                    updateProgress();
                } else if (new Date(data.updated_at) < new Date(localUpdatedAt)) {
                    await pushStateToServer();
                }
            } else {
                await pushStateToServer();
            }
        }

        let pollTimer = null;
        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(pollCycle, 7000);
            pollCycle();
            window.addEventListener('focus', pollCycle);
        }

        async function pollCycle() {
            const info = getSyncInfo();
            if (!info) return;
            const t = i18n[lang];

            // If we are waiting for approval
            if (info.pending) {
                const { data } = await sb.from('marvel_tracker_devices').select('*').eq('key_id', info.keyId).eq('device_id', deviceId).maybeSingle();
                if (data && data.approved) {
                    setSyncInfo({ keyId: info.keyId, keyHash: info.keyHash });
                    await pullAndMergeState(info.keyId);
                    updateSyncStatusUI();
                } else {
                    return;
                }
            } else {
                // Check if our device was removed (Kicked out)
                const { data: myDevice } = await sb.from('marvel_tracker_devices').select('*').eq('key_id', info.keyId).eq('device_id', deviceId).maybeSingle();
                if (!myDevice) {
                    // We got kicked out! Clean local sync info.
                    localStorage.removeItem('marvel_sync_info');
                    alert("You have been logged out from another device.");
                    location.reload();
                    return;
                }

                await pullAndMergeState(info.keyId);
                const { data: allDevices } = await sb.from('marvel_tracker_devices').select('*').eq('key_id', info.keyId);
                if (allDevices) {
                    deviceCountCache = allDevices.filter(d => d.approved).length || 1;
                    updateSyncStatusUI();
                    
                    const pendingOther = allDevices.find(d => !d.approved && d.device_id !== deviceId);
                    const banner = document.getElementById('approvalBanner');
                    if (pendingOther) {
                        document.getElementById('approvalText').innerHTML = t.approvalBannerText(pendingOther.device_label || 'Unknown device');
                        banner.classList.remove('hidden');
                        document.getElementById('approveBtn').onclick = async () => {
                            await sb.from('marvel_tracker_devices').update({ approved: true }).eq('id', pendingOther.id);
                            banner.classList.add('hidden');
                            await loadDevices(); // Update list if modal is open
                        };
                        document.getElementById('denyBtn').onclick = async () => {
                            await sb.from('marvel_tracker_devices').delete().eq('id', pendingOther.id);
                            banner.classList.add('hidden');
                        };
                    } else {
                        banner.classList.add('hidden');
                    }
                }
            }
        }

        applyStaticText();
        loadMoviesData();
        if (getSyncInfo()) startPolling();
    </script>
</body>
</html>
