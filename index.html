            { id:"dp_w", title:"Deadpool & Wolverine (2024)", date:"2024-07-26", uni:"mcu", note:"ফক্স ইউনিভার্স বাঁচাতে ডেডপুল আর উলভারিনের MCU টাইমলাইনে গ্র্যান্ড এন্ট্রি!", note_en:"Deadpool and Wolverine's grand entry into the MCU timeline to save the Fox universe!" },
            { id:"agatha", title:"Agatha All Along (Disney+, 2024)", date:"2024-09-18", uni:"mcutv", note:"WandaVision-এর অ্যাগাথার স্পিন-অফ।", note_en:"A spin-off following WandaVision's Agatha." },
            { id:"venom3", title:"Venom: The Last Dance (2024)", date:"2024-10-25", uni:"sony", note:"এডি ব্রক ও ভেনমের ট্রিলজি সমাপ্তি।", note_en:"Eddie Brock and Venom's trilogy comes to a close." },
            { id:"kraven", title:"Kraven the Hunter (2024)", date:"2024-12-13", uni:"sony", note:"সের্গেই ক্রাভিনফের শিকারি হয়ে ওঠা।", note_en:"Sergei Kravinoff becomes the Hunter." },
            { id:"ca_bnw", title:"Captain America: Brave New World (2025)", date:"2025-02-14", uni:"mcu", note:"স্যাম উইলসনের প্রথম একক ক্যাপ্টেন আমেরিকা মিশন।", note_en:"Sam Wilson's first solo mission as Captain America." },
            { id:"dd_born", title:"Daredevil: Born Again - Season 1 (Disney+, 2025)", date:"2025-03-04", uni:"mcutv", note:"ম্যাট মারডক ও কিংপিনের MCU-তে পুনরাগমন।", note_en:"Matt Murdock and Kingpin return in the MCU." },
            { id:"thunderbolts", title:"Thunderbolts* (2025)", date:"2025-05-02", uni:"mcu", note:"অ্যান্টি-হিরোদের নতুন দল গঠন।", note_en:"A new team of anti-heroes is formed." },
            { id:"ironheart", title:"Ironheart (Disney+, 2025)", date:"2025-06-24", uni:"mcutv", note:"রিরি উইলিয়ামসের নিজস্ব আয়রনম্যান-সদৃশ স্যুট।", note_en:"Riri Williams builds her own Iron Man-style suit." },
            { id:"ff_first", title:"The Fantastic Four: First Steps (2025)", date:"2025-07-25", uni:"mcu", note:"মি. ফ্যান্টাস্টিকদের MCU অরিজিন, যারা একটি ভিন্ন ইউনিভার্সে বাস করত।", note_en:"The Fantastic Four's MCU origin — a team that lived in a different universe." },
            { id:"wonderman", title:"Wonder Man (Disney+, 2026)", date:"2026-01-27", uni:"mcutv", note:"সাইমন উইলিয়ামসের সুপারহিরো-অভিনেতা জীবন।", note_en:"Simon Williams' life as a superhero-actor." },
            { id:"dd_born_s2", title:"Daredevil: Born Again - Season 2 (Disney+, 2026)", date:"2026-03-01", uni:"mcutv", note:"বর্ন এগেইনের দ্বিতীয় সিজন।", note_en:"Born Again's second season." },
            { id:"visionquest", title:"Vision Quest (Disney+, 2026)", date:"2026-10-14", uni:"future", note:"WandaVision-ধারার তৃতীয় কিস্তি, ভিশনকে কেন্দ্র করে।", note_en:"The third entry in the WandaVision line, centered on Vision." },
            { id:"sm_bnd", title:"Spider-Man: Brand New Day (2026)", date:"2026-07-31", uni:"future", note:"টম হল্যান্ডের চতুর্থ স্পাইডার-ম্যান — খুব শীঘ্রই মুক্তি পাচ্ছে!", note_en:"Tom Holland's fourth Spider-Man — releasing very soon!" },
            { id:"avengers_doom", title:"Avengers: Doomsday (2026)", date:"2026-12-18", uni:"future", note:"রবার্ট ডাউনি জুনিয়রের ডক্টর ডুম হিসেবে এন্ট্রি, ফক্সের এক্স-মেন ও ফ্যান্টাস্টিক ফোরের সংযুক্তি।", note_en:"Robert Downey Jr. enters as Doctor Doom; Fox's X-Men and the Fantastic Four join in." },
            { id:"dd_born_s3", title:"Daredevil: Born Again - Season 3 (Disney+, 2027)", date:"2027-03-01", uni:"future", note:"বর্ন এগেইনের তৃতীয় সিজন।", note_en:"Born Again's third season." },
            { id:"beyondverse", title:"Spider-Man: Beyond the Spider-Verse (2027)", date:"2027-06-04", uni:"future", note:"অ্যানিমেটেড স্পাইডার-ভার্স ট্রিলজির সমাপ্তি।", note_en:"The animated Spider-Verse trilogy concludes." },
            { id:"avengers_sw", title:"Avengers: Secret Wars (2027)", date:"2027-12-17", uni:"future", note:"সব ইউনিভার্স (Sony, Fox, MCU) ভেঙে এক হয়ে সবচেয়ে বড় মহাযুদ্ধ!", note_en:"Every universe (Sony, Fox, MCU) collapses into one for the biggest war yet!" }
        ];
        marvelData.sort((a, b) => new Date(a.date) - new Date(b.date));
        const today = new Date("2026-07-27");
        const totalMovies = marvelData.length;

        let savedState = JSON.parse(localStorage.getItem('marvelUltimateTracker')) || {};

        // ---------------- Sync state ----------------
        const getDeviceId = () => {
            let d = localStorage.getItem('marvel_device_id');
            if (!d) { d = crypto.randomUUID(); localStorage.setItem('marvel_device_id', d); }
            return d;
        };
        const deviceId = getDeviceId();
        const deviceLabel = (navigator.userAgentData?.platform || navigator.platform || 'Device') + ' · ' + (navigator.userAgent.match(/Chrome|Firefox|Safari|Edg/)?.[0] || 'Browser');

        function getSyncInfo() {
            const raw = localStorage.getItem('marvel_sync_info');
            return raw ? JSON.parse(raw) : null;
        }
        function setSyncInfo(info) { localStorage.setItem('marvel_sync_info', JSON.stringify(info)); }

        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ---------------- Rendering ----------------
        function getUniverseBadge(uni) {
            const t = i18n[lang];
            const label = t.badges[uni] || '';
            return `<span class="universe-badge ${uni}">${label}</span>`;
        }
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const monthsBn = ["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
            const monthsEn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const months = lang === 'bn' ? monthsBn : monthsEn;
            return `${months[d.getMonth()]} ${d.getFullYear()}`;
        }
        function updateProgress() {
            const checkedCount = Object.values(savedState).filter(v => v === true).length;
            const percentage = totalMovies === 0 ? 0 : Math.round((checkedCount / totalMovies) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}% (${checkedCount}/${totalMovies})`;
        }
        async function pushStateToServer() {
            const info = getSyncInfo();
            if (!info) return;
            const nowIso = new Date().toISOString();
            await sb.from('marvel_tracker_state').upsert({ key_id: info.keyId, state: savedState, updated_at: nowIso });
            localStorage.setItem('marvel_state_updated_at', nowIso);
        }
        function toggleCheckbox(id) {
            savedState[id] = !savedState[id];
            localStorage.setItem('marvelUltimateTracker', JSON.stringify(savedState));
            const labelContainer = document.getElementById(`container-${id}`);
            if (savedState[id]) { labelContainer.classList.add('checked-item', 'bg-slate-800'); labelContainer.classList.remove('bg-slate-800/40'); }
            else { labelContainer.classList.remove('checked-item', 'bg-slate-800'); labelContainer.classList.add('bg-slate-800/40'); }
            updateProgress();
            pushStateToServer();
        }
        window.toggleCheckbox = toggleCheckbox;

        function renderList() {
            const container = document.getElementById('movie-list');
            container.innerHTML = '';
            marvelData.forEach(movie => {
                const isChecked = savedState[movie.id] || false;
                const isReleased = new Date(movie.date) <= today;
                const bgClass = isChecked ? 'bg-slate-800 checked-item' : 'bg-slate-800/40';
                const note = lang === 'bn' ? movie.note : movie.note_en;
                const html = `
                    <label id="container-${movie.id}" class="flex items-start space-x-4 p-4 mb-3 rounded-xl cursor-pointer transition-all duration-300 hover:bg-slate-700 hover:shadow-lg border border-slate-700/50 ${bgClass}">
                        <div class="pt-1">
                            <input type="checkbox" id="${movie.id}" ${isChecked ? 'checked' : ''} ${isReleased ? '' : 'disabled'}
                                   class="w-6 h-6 text-blue-500 bg-slate-900 border-slate-600 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed"
                                   onclick="toggleCheckbox('${movie.id}')">
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center flex-wrap gap-2 mb-1">
                                <span class="date-badge">${formatDate(movie.date)}</span>
                                <span class="title-text font-bold text-lg md:text-xl text-slate-100">${movie.title}</span>
                                ${getUniverseBadge(movie.uni)}
                                ${(!isReleased && movie.uni !== 'future') ? `<span class="universe-badge future">${i18n[lang].upcoming}</span>` : ''}
                            </div>
                            <p class="note-text text-sm md:text-base text-slate-400 leading-relaxed">${note}</p>
                        </div>
                    </label>`;
                container.innerHTML += html;
            });
        }

        function renderLegend() {
            const t = i18n[lang];
            const order = ['mcu','mcutv','sony','sonyanim','fox','netflix','other'];
            document.getElementById('legendRow').innerHTML = order.map(u => `<span class="universe-badge ${u}">${t.badges[u]}</span>`).join('') + `<span class="universe-badge future">${t.upcoming}</span>`;
        }

        function applyStaticText() {
            const t = i18n[lang];
            document.getElementById('htmlRoot').lang = lang;
            document.title = t.title;
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('pageSubtitle').innerText = t.subtitle;
            document.getElementById('pageTodayNote').innerText = t.todayNote;
            document.getElementById('progressLabel').innerText = t.progressLabel;
            document.getElementById('genKeyBtn').innerText = t.genKeyBtn;
            document.getElementById('syncBtn').innerText = t.syncBtn;
            document.getElementById('genModalTitle').innerText = t.genModalTitle;
            document.getElementById('genModalDesc').innerText = t.genModalDesc;
            document.getElementById('genName').placeholder = t.namePh;
            document.getElementById('genEmail').placeholder = t.emailPh;
            document.getElementById('genCountry').placeholder = t.countryPh;
            document.getElementById('genOnceWarning').innerText = t.genOnceWarning;
            document.getElementById('genSubmitBtn').innerText = t.genSubmit;
            document.getElementById('genCancelBtn').innerText = t.genCancel;
            document.getElementById('approveBtn').innerText = t.approveBtn;
            document.getElementById('denyBtn').innerText = t.denyBtn;
            renderLegend();
            updateSyncStatusUI();
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            lang = lang === 'bn' ? 'en' : 'bn';
            localStorage.setItem('marvel_lang', lang);
            applyStaticText();
            renderList();
        });

        // ---------------- Sync status UI ----------------
        let deviceCountCache = 1;
        function updateSyncStatusUI() {
            const t = i18n[lang];
            const info = getSyncInfo();
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncStatusText');
            if (info) {
                dot.className = 'sync-dot bg-emerald-500';
                text.innerText = t.syncedText(deviceCountCache);
            } else {
                dot.className = 'sync-dot bg-slate-500';
                text.innerText = t.notSyncedText;
            }
        }

        // ---------------- Generate Key ----------------
        const genKeyModal = document.getElementById('genKeyModal');
        document.getElementById('genKeyBtn').addEventListener('click', () => {
            document.getElementById('genStatusMsg').innerText = '';
            genKeyModal.classList.remove('hidden');
        });
        document.getElementById('genCancelBtn').addEventListener('click', () => genKeyModal.classList.add('hidden'));

        document.getElementById('genSubmitBtn').addEventListener('click', async () => {
            const t = i18n[lang];
            const name = document.getElementById('genName').value.trim();
            const email = document.getElementById('genEmail').value.trim();
            const country = document.getElementById('genCountry').value.trim();
            const statusEl = document.getElementById('genStatusMsg');
            if (!name || !email || !country) { statusEl.className = 'text-red-400 text-xs mt-3'; statusEl.innerText = t.genMissing; return; }
            statusEl.className = 'text-slate-400 text-xs mt-3'; statusEl.innerText = t.genWorking;
            try {
                const rawKey = crypto.randomUUID() + '-' + crypto.randomUUID().replace(/-/g, '').slice(0, 12);
                const keyHash = await sha256Hex(rawKey);

                const { data: keyRow, error: keyErr } = await sb.from('marvel_tracker_keys')
                    .insert({ key_hash: keyHash, name, email, country }).select('id').single();
                if (keyErr) throw keyErr;

                await sb.from('marvel_tracker_devices').insert({ key_id: keyRow.id, device_id: deviceId, device_label: deviceLabel, approved: true });
                const nowIso = new Date().toISOString();
                await sb.from('marvel_tracker_state').upsert({ key_id: keyRow.id, state: savedState, updated_at: nowIso });

                setSyncInfo({ keyId: keyRow.id, keyHash });
                localStorage.setItem('marvel_state_updated_at', nowIso);

                const payload = { key: rawKey, name, email, country, created_at: nowIso };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'marvel-tracker-key.json';
                document.body.appendChild(a); a.click(); a.remove();

                statusEl.className = 'text-emerald-400 text-xs mt-3'; statusEl.innerText = t.genDone;
                updateSyncStatusUI();
                startPolling();
                setTimeout(() => genKeyModal.classList.add('hidden'), 1800);
            } catch (e) {
                console.error(e);
                statusEl.className = 'text-red-400 text-xs mt-3'; statusEl.innerText = t.genError;
            }
        });

        // ---------------- Sync (upload key.json) ----------------
        const keyFileInput = document.getElementById('keyFileInput');
        document.getElementById('syncBtn').addEventListener('click', () => keyFileInput.click());

        keyFileInput.addEventListener('change', async (e) => {
            const t = i18n[lang];
            const file = e.target.files[0];
            keyFileInput.value = '';
            if (!file) return;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);
                const keyHash = await sha256Hex(parsed.key);

                const { data: keyId, error: rpcErr } = await sb.rpc('marvel_tracker_get_key_id', { p_key_hash: keyHash });
                if (rpcErr || !keyId) { alert(t.syncInvalidKey); return; }

                const { data: existingDevice } = await sb.from('marvel_tracker_devices')
                    .select('*').eq('key_id', keyId).eq('device_id', deviceId).maybeSingle();

                if (existingDevice && existingDevice.approved) {
                    setSyncInfo({ keyId, keyHash });
                    await sb.from('marvel_tracker_devices').update({ last_seen: new Date().toISOString() }).eq('id', existingDevice.id);
                    await pullAndMergeState(keyId);
                    alert(t.syncApprovedNow);
                    updateSyncStatusUI();
                    startPolling();
                    return;
                }

                if (!existingDevice) {
                    await sb.from('marvel_tracker_devices').insert({ key_id: keyId, device_id: deviceId, device_label: deviceLabel, approved: false });
                }
                alert(t.syncWaitingApproval);
                setSyncInfo({ keyId, keyHash, pending: true });
                updateSyncStatusUI();
                startPolling();
            } catch (err) {
                console.error(err);
                alert(t.syncInvalidKey);
            }
        });

        async function pullAndMergeState(keyId) {
            const { data } = await sb.from('marvel_tracker_state').select('*').eq('key_id', keyId).maybeSingle();
            if (data) {
                const localUpdatedAt = localStorage.getItem('marvel_state_updated_at');
                if (!localUpdatedAt || new Date(data.updated_at) > new Date(localUpdatedAt)) {
                    savedState = data.state || {};
                    localStorage.setItem('marvelUltimateTracker', JSON.stringify(savedState));
                    localStorage.setItem('marvel_state_updated_at', data.updated_at);
                    renderList();
                    updateProgress();
                } else if (new Date(data.updated_at) < new Date(localUpdatedAt)) {
                    await pushStateToServer();
                }
            } else {
                await pushStateToServer();
            }
        }

        // ---------------- Polling: pending-device approval + state sync ----------------
        let pollTimer = null;
        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(pollCycle, 7000);
            pollCycle();
            window.addEventListener('focus', pollCycle);
        }

        async function pollCycle() {
            const info = getSyncInfo();
            if (!info) return;
            const t = i18n[lang];

            if (info.pending) {
                const { data } = await sb.from('marvel_tracker_devices').select('*').eq('key_id', info.keyId).eq('device_id', deviceId).maybeSingle();
                if (data && data.approved) {
                    setSyncInfo({ keyId: info.keyId, keyHash: info.keyHash });
                    await pullAndMergeState(info.keyId);
                    updateSyncStatusUI();
                } else {
                    return;
                }
            } else {
                await pullAndMergeState(info.keyId);
                const { data: allDevices } = await sb.from('marvel_tracker_devices').select('*').eq('key_id', info.keyId);
                if (allDevices) {
                    deviceCountCache = allDevices.filter(d => d.approved).length || 1;
                    updateSyncStatusUI();
                    const pendingOther = allDevices.find(d => !d.approved && d.device_id !== deviceId);
                    const banner = document.getElementById('approvalBanner');
                    if (pendingOther) {
                        document.getElementById('approvalText').innerText = t.approvalBannerText(pendingOther.device_label || 'Unknown device');
                        banner.classList.remove('hidden');
                        document.getElementById('approveBtn').onclick = async () => {
                            await sb.from('marvel_tracker_devices').update({ approved: true }).eq('id', pendingOther.id);
                            banner.classList.add('hidden');
                        };
                        document.getElementById('denyBtn').onclick = async () => {
                            await sb.from('marvel_tracker_devices').delete().eq('id', pendingOther.id);
                            banner.classList.add('hidden');
                        };
                    } else {
                        banner.classList.add('hidden');
                    }
                }
            }
        }

        // ---------------- Init ----------------
        applyStaticText();
        renderList();
        updateProgress();
        if (getSyncInfo()) startPolling();
    </script>
</body>
</html>
