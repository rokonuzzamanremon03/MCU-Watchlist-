                    { id: "avengers_doom", title: "Avengers: Doomsday (2026)", uni: "future", note: "রবার্ট ডাউনি জুনিয়রের ডক্টর ডুম হিসেবে এন্ট্রি এবং নতুন ভিলেনের উত্থান।" },
                    { id: "avengers_sw", title: "Avengers: Secret Wars (2027)", uni: "future", note: "সব ইউনিভার্স (সনি, ফক্স, এমসিইউ) ভেঙে এক হয়ে সবচেয়ে বড় মহাযুদ্ধ!" }
                ]
            }
        ];

        const container = document.getElementById('movie-list');
        let totalMovies = 0;

        // Load progress from localStorage
        let savedState = JSON.parse(localStorage.getItem('marvelUltimateTracker')) || {};

        function getUniverseBadge(uni) {
            if(uni === 'mcu') return '<span class="universe-badge mcu">MCU</span>';
            if(uni === 'sony') return '<span class="universe-badge sony">SONY</span>';
            if(uni === 'fox') return '<span class="universe-badge fox">FOX</span>';
            if(uni === 'netflix') return '<span class="universe-badge netflix">NETFLIX</span>';
            if(uni === 'future') return '<span class="universe-badge future">UPCOMING</span>';
            return '';
        }

        function updateProgress() {
            const checkedCount = Object.values(savedState).filter(v => v === true).length;
            const percentage = totalMovies === 0 ? 0 : Math.round((checkedCount / totalMovies) * 100);
            
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}% (${checkedCount}/${totalMovies})`;
        }

        function toggleCheckbox(id) {
            savedState[id] = !savedState[id];
            localStorage.setItem('marvelUltimateTracker', JSON.stringify(savedState));
            
            const labelContainer = document.getElementById(`container-${id}`);
            
            if(savedState[id]) {
                labelContainer.classList.add('checked-item');
                labelContainer.classList.add('bg-slate-800');
                labelContainer.classList.remove('bg-slate-800/40');
            } else {
                labelContainer.classList.remove('checked-item');
                labelContainer.classList.remove('bg-slate-800');
                labelContainer.classList.add('bg-slate-800/40');
            }
            updateProgress();
        }

        // Generate HTML from Data
        marvelData.forEach((section, index) => {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = "mb-12";
            
            sectionDiv.innerHTML = `
                <div class="border-l-4 border-red-500 pl-4 mb-5">
                    <h2 class="text-2xl md:text-3xl font-bold text-white mb-2">${section.phase}</h2>
                    <p class="text-slate-400 text-sm md:text-base">${section.description}</p>
                </div>
                <div class="space-y-4" id="section-${index}"></div>
            `;
            container.appendChild(sectionDiv);

            const moviesContainer = document.getElementById(`section-${index}`);
            
            section.movies.forEach(movie => {
                totalMovies++;
                const isChecked = savedState[movie.id] || false;
                const bgClass = isChecked ? 'bg-slate-800 checked-item' : 'bg-slate-800/40';
                
                const movieHtml = `
                    <label id="container-${movie.id}" class="flex items-start space-x-4 p-4 rounded-xl cursor-pointer transition-all duration-300 hover:bg-slate-700 hover:shadow-lg border border-slate-700/50 ${bgClass}">
                        <div class="pt-1">
                            <input type="checkbox" id="${movie.id}" ${isChecked ? 'checked' : ''} 
                                   class="w-6 h-6 text-blue-500 bg-slate-900 border-slate-600 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer"
                                   onclick="toggleCheckbox('${movie.id}')">
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center flex-wrap gap-2 mb-1">
                                <span class="title-text font-bold text-lg md:text-xl text-slate-100">${movie.title}</span>
                                ${getUniverseBadge(movie.uni)}
                            </div>
                            <p class="note-text text-sm md:text-base text-slate-400 leading-relaxed">${movie.note}</p>
                        </div>
                    </label>
                `;
                moviesContainer.innerHTML += movieHtml;
            });
        });

        // First render update
        updateProgress();
    </script>
</body>
</html>
